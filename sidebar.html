<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞书文档 AI 助手</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-title">
        <span class="app-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </span>
        飞书文档 AI 助手
      </div>
      <div class="app-actions">
        <button id="settingsBtn" class="icon-btn" title="配置" aria-label="配置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button id="closeBtn" class="icon-btn" title="关闭" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </header>

    <div id="configAlert" class="alert hidden">
      <span>请先完成插件配置</span>
      <button id="openOptions" class="btn-sm">去配置</button>
    </div>

    <div id="docLoading" class="status">正在读取文档内容…</div>

    <main id="main" class="hidden">
      <nav class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="chat" role="tab" aria-selected="true">对话</button>
        <button class="tab-btn" data-tab="summary" role="tab" aria-selected="false">总结</button>
      </nav>

      <div class="tab-panels">
        <section id="panel-chat" class="panel active">
          <div id="chatMessages" class="chat-messages"></div>
          <div class="chat-input-wrap">
            <textarea id="chatInput" rows="1" placeholder="输入问题，按 Enter 发送…"></textarea>
            <button id="sendBtn" class="send-btn" aria-label="发送">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </section>

        <section id="panel-summary" class="panel">
          <nav class="subtabs" role="tablist">
            <button class="subtab-btn active" data-subtab="overview" role="tab" aria-selected="true">概要</button>
            <button class="subtab-btn" data-subtab="fine" role="tab" aria-selected="false">精读</button>
            <button class="subtab-btn" data-subtab="mindmap" role="tab" aria-selected="false">思维导图</button>
          </nav>
          <div class="subtab-panels">
            <div id="sub-overview" class="subpanel active"></div>
            <div id="sub-fine" class="subpanel"></div>
            <div id="sub-mindmap" class="subpanel">
              <div id="mindmapTree" class="mindmap-tree"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div id="error" class="error hidden"></div>
  </div>

  <script type="module" src="sidebar.js"></script>
</body>
</html>
